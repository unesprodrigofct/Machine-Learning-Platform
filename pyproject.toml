[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-platform"
version = "0.1.0"
description = "A configurable and reproducible machine learning training and serving platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.8,<3.0",
    "PyYAML>=6.0,<7.0",
    "scikit-learn>=1.5,<2.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
database = ["sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0"]
xgboost = ["xgboost>=2.1,<4.0"]
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0", "httpx2>=2.9,<3.0"]

[project.scripts]
ml-platform = "ml_platform.interfaces.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
